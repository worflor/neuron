# Push .github/labels.yml onto the repo's labels whenever it changes on main.
#
# labels.yml is the configuration of record, but until now applying it was a manual step, and
# a manual step is exactly how config and reality drift apart. This removes the step. It runs
# the same script you'd run by hand, so there's still exactly one implementation.
#
# Safe to run on every change: the sync is idempotent and NEVER deletes a label. A label that
# exists on GitHub but not in the file is reported in the run log, not removed.
#
# It is a few seconds on linux, and ci.yml's gate treats these files as non-code, so editing
# labels never triggers a windows build.

name: sync-labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/sync-labels.sh
  workflow_dispatch:

permissions:
  issues: write # creating/updating labels is an issues-scoped permission

concurrency:
  group: sync-labels
  cancel-in-progress: false # never interrupt a half-applied label set

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/sync-labels.sh "${{ github.repository }}"
