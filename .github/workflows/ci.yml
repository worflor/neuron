# The gate on every push and pull request.
#
# THIS FILE DELIBERATELY CONTAINS NO CARGO COMMANDS. The gates live in `validate.ps1` at the
# repo root, and both CI and a human run the same script. If CI spelled out its own cargo
# invocations they would drift from what you run locally, and "it passed on my machine" would
# stop meaning anything. All this workflow decides is WHICH MODE runs on WHICH RUNNER.
#
#   .\validate.ps1              <- before you commit
#   .\validate.ps1 -Mode full   <- the thorough pass, same as the manual "full" run below
#
# COST MODEL, because this is a private repo and minutes are real: GitHub bills windows
# runners at a 2x multiplier and linux at 1x. So the shape here is "let the cheap runner
# decide whether the expensive one has to wake up at all":
#
#   gate  (linux, ~10s, 1x)  - did any CODE change?
#     +-- test  (windows, 2x)  only if code changed
#     +-- seams (linux,   1x)  only if code changed
#
# A docs-only push - which is most of them around a release - costs about six seconds instead
# of a full windows build plus a linux build.
#
# The previous version also ran fmt and clippy on a SECOND windows runner: paying the 2x
# multiplier twice to compile the same tree, for two signals that are advisory and cannot
# block anything. fmt moved to the linux lane, because formatting is pure parsing and needs no
# platform. clippy moved to `-Mode full`, because it is a whole second compilation of the
# workspace and running it on every push roughly doubled the cost of the expensive job to
# learn nothing that gates a merge. Run it before a release, or locally, whenever you want it.
#
# WHY A `gate` JOB INSTEAD OF `paths-ignore`: a skipped-by-`if` job still REPORTS, so it
# satisfies a required status check. A path-filtered workflow simply never runs, and if
# branch protection is ever turned on (it needs Pro or a public repo, so not yet) every
# docs-only PR would sit forever waiting for a check that is never coming. This shape cannot
# develop that problem later.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: "quick = what every push runs. full = + feature matrix + release build + the CI-safe ignored tests."
        type: choice
        options: [quick, full]
        default: quick

# A new push to the same branch supersedes the old run - don't burn minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the base

      - id: decide
        shell: bash
        run: |
          set -euo pipefail

          # A manual run is always deliberate - never second-guess it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run: forcing the full job set"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A brand-new branch reports an all-zero "before" and has nothing to diff against.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base ref: assuming code changed"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # Everything that CANNOT affect a build. Anything not matched here counts as code,
          # so the failure mode is "ran CI unnecessarily", never "skipped a real change".
          code="$(printf '%s\n' "$changed" | grep -vE \
            -e '(^|/)[^/]+\.md$' \
            -e '^docs/' \
            -e '^LICENSES?/' \
            -e '^LICENSE\.md$' \
            -e '^\.github/(ISSUE_TEMPLATE|CODEOWNERS|labels\.yml|social-preview\.png|LABELS\.md|pull_request_template\.md)' \
            -e '^_shots/' \
            || true)"

          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> code changed, running the full job set"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> docs only, skipping the build jobs"
          fi

  test:
    name: build + test (windows)
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: windows-latest
    # 90, not 45. The first cold run - no rust cache, no CPython cache, the whole workspace
    # plus every test binary from scratch on a 2-core runner - hit exactly 45 minutes and was
    # cancelled, which is also why nothing got cached. This needs enough headroom to finish
    # ONCE; after that the cache makes it a fraction of this. If a warm run ever approaches
    # 90 minutes, something is wrong and the timeout should stay put while you find out what.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # cache-on-failure is load-bearing, not a nicety. rust-cache only saves on success by
      # default, so a job that times out saves NOTHING - the next run starts cold, takes just
      # as long, times out again, and CI is permanently stuck with no way to warm itself.
      # That is exactly what happened on the first run of this workflow.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # THE NEURON-SPECIFIC ONE. `crates/neuron-core/build.rs` downloads a ~46 MB
      # python-build-standalone tarball, sha256-checks it against the release manifest, then
      # embeds it. Uncached, every cold run re-downloads it: slower, and a network dependency
      # on the critical path of every build (i.e. a flake source unrelated to the code).
      - name: Cache the bundled CPython tarball
        uses: actions/cache@v4
        with:
          path: vendor/pbs-cache
          key: pbs-${{ runner.os }}-${{ hashFiles('crates/neuron-core/build.rs') }}
          restore-keys: pbs-${{ runner.os }}-

      - name: validate
        shell: pwsh
        run: ./validate.ps1 -Mode ${{ inputs.depth == 'full' && 'full' || 'quick' }}

  seams:
    name: cross-platform seams (linux)
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This does NOT claim neuron runs on linux. It claims the cross-platform SEAMS still
    # compile, which is a real thing to protect: the stubs are inert off windows, so nothing
    # else would notice them rotting until someone actually attempts the port. The excluded
    # crate and the reasoning live in validate.ps1, next to the command.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # cache-on-failure is load-bearing, not a nicety. rust-cache only saves on success by
      # default, so a job that times out saves NOTHING - the next run starts cold, takes just
      # as long, times out again, and CI is permanently stuck with no way to warm itself.
      # That is exactly what happened on the first run of this workflow.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Cache the bundled CPython tarball
        uses: actions/cache@v4
        with:
          path: vendor/pbs-cache
          key: pbs-${{ runner.os }}-${{ hashFiles('crates/neuron-core/build.rs') }}
          restore-keys: pbs-${{ runner.os }}-

      - name: validate
        shell: pwsh
        run: ./validate.ps1 -Mode seams
