# Cut a release ZIP.
#
# Runs only on a pushed version tag (`v0.1.0`, `v0.2.0-mk1`, …) or a manual
# `workflow_dispatch` - never on push to main or on pull requests; `ci.yml` covers those.
#
# Opens the release as a draft: nothing is publicly visible until reviewed and published.
# Flip `--draft` below to publish straight away.
#
# No code signing: an OV certificate needs hardware-token/cloud-HSM storage and still doesn't
# clear SmartScreen on its own. Instead this attaches build provenance - a cryptographic
# attestation binding the zip to the exact commit and workflow run, verifiable with
# `gh attestation verify` - proving where the binary came from.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual build (e.g. v0.1.0-test)"
        required: true
        default: v0.0.0-dev

permissions:
  contents: write # create the release + upload assets
  id-token: write # provenance attestation signing
  attestations: write # record the attestation

env:
  CARGO_TERM_COLOR: always

  # Static CRT, or the zip doesn't launch on a clean machine: a Rust MSVC binary otherwise
  # imports VCRUNTIME140.dll (ships with the VC++ Redistributable, not with Windows itself),
  # so a fresh install without it gets a missing-DLL dialog. +crt-static links the runtime in
  # instead; the api-ms-win-crt-* imports are the Universal CRT and are part of Windows 10+.
  # Scoped to this workflow only, so local builds and ci.yml's cache are untouched.
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows:
    name: windows x86_64
    runs-on: windows-latest
    # `-Mode full` runs the test compile, a clippy compile, four feature checks, and a ThinLTO
    # release build, all on 2 cores - 60 min would time out before that finishes.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # A release must never ship a version that disagrees with the binary. `neuron --version`
      # reports Cargo.toml's workspace version, so the tag has to say the same thing.
      - name: Tag matches Cargo version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          cargo_ver="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          # `v0.1.0` and suffixed labels like `v0.1.0-mk1` both match Cargo `0.1.0`.
          if [ "${tag%%-*}" != "$cargo_ver" ]; then
            echo "::error::tag $tag does not match Cargo.toml's workspace version ($cargo_ver). Bump [workspace.package] version, commit, then tag."
            exit 1
          fi
          echo "tag $tag matches Cargo $cargo_ver"

      # Provenance attestations only work on public repos. SOURCE.txt tells users to verify
      # one, so a tagged release from a private repo would ship a promise it can't keep. Tag
      # pushes fail fast here; a manual test run (workflow_dispatch) skips attestation instead,
      # with a warning.
      - name: Releases need a public repo
        if: github.event_name == 'push' && github.event.repository.private
        shell: bash
        run: |
          echo "::error::this repo is private, so the build provenance attestation cannot be created. Make the repo public, then push the tag again."
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy # -Mode full runs clippy; without this it reports a phantom failure

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true # same reason as ci.yml: a failed run must still warm the cache

      # Same cache as ci.yml - build.rs fetches a ~46 MB CPython tarball on a miss.
      - name: Cache the bundled CPython tarball
        uses: actions/cache@v6
        with:
          path: vendor/pbs-cache
          key: pbs-${{ runner.os }}-${{ hashFiles('crates/neuron-core/build.rs') }}
          restore-keys: pbs-${{ runner.os }}-

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # The gates run against a release too - a tag must not ship something main wouldn't
      # accept. Runs the full pass (feature matrix + no-hardware ignored tests), the same
      # script a contributor runs locally.
      - name: validate (full)
        shell: pwsh
        run: ./validate.ps1 -Mode full

      # -Mode full already produced the release binaries; this is a cached no-op so the
      # packaging step below never depends on that implementation detail.
      - name: build
        run: cargo build --release --workspace --locked

      # Stage the zip. The license bundle ships with the binary, not just in the repo: neuron
      # is GPL-3.0-or-later, so a binary release carries its terms and a pointer back to the
      # exact source it was built from.
      - name: Stage the package
        shell: bash
        run: |
          set -euo pipefail
          name="neuron-${{ steps.v.outputs.version }}-windows-x86_64"
          mkdir -p "dist/$name"
          cp target/release/neuron-app.exe "dist/$name/"
          cp target/release/neuron.exe     "dist/$name/"
          cp README.md LICENSE.md THIRD-PARTY-NOTICES.md SECURITY.md "dist/$name/"
          cp -r LICENSES "dist/$name/"
          cp -r skills "dist/$name/"
          cat > "dist/$name/SOURCE.txt" <<EOF
          neuron ${{ steps.v.outputs.version }} — windows x86_64

          Built by GitHub Actions from:
            repository : ${{ github.server_url }}/${{ github.repository }}
            commit     : ${{ github.sha }}
            source     : ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
            run        : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This build is NOT code-signed. Windows SmartScreen will warn on first run;
          "More info" -> "Run anyway". Rather than trusting that dialog, verify the build
          provenance — it proves this binary came from the commit above:

            gh attestation verify $name.zip --repo ${{ github.repository }}

          Corresponding source for this binary is the commit linked above, per GPL-3.0-or-later.
          EOF
          echo "name=$name" >> "$GITHUB_ENV"

      - name: Zip + checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:name" -DestinationPath "dist/$env:name.zip"
          $h = (Get-FileHash "dist/$env:name.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $env:name.zip" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8

      # Signed provenance tying the artifact to this commit + this workflow. Verify with
      # `gh attestation verify <zip> --repo <owner/repo>`.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ env.name }}.zip

      - name: Warn when there is no attestation
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          msg="TEST BUILD ONLY: the repo is private, so this zip has NO provenance attestation, and its SOURCE.txt tells users to verify one. Delete this draft; do not publish it."
          echo "::warning::$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes in .github/releases/<tag>.md win; otherwise GitHub generates them.
          notes=".github/releases/${{ steps.v.outputs.version }}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "${{ steps.v.outputs.version }}" \
            "dist/${{ env.name }}.zip" \
            "dist/SHA256SUMS.txt" \
            --draft \
            --title "neuron ${{ steps.v.outputs.version }}" \
            "${notes_args[@]}" \
            || gh release upload "${{ steps.v.outputs.version }}" \
                 "dist/${{ env.name }}.zip" "dist/SHA256SUMS.txt" --clobber
