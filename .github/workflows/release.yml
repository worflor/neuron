# Cut a release.
#
# Runs only on a pushed version tag or a manual
# `workflow_dispatch` - never on push to main or on pull requests; `ci.yml` covers those.
#
# Windows release, three stages:
#
#   preflight (linux, ~10s)  - the refusals: tag vs Cargo version, private repo
#     +-- windows            - installer + portable ZIP
#           +-- publish      - one checksum file, one attestation pass, one draft release
#
# The build job uploads an artifact and publishes nothing until the final stage.
#
# Opens the release as a draft: nothing is publicly visible until reviewed and published.
# Flip `--draft` below to publish straight away.
#
# No code signing: an OV certificate needs hardware-token/cloud-HSM storage and still doesn't
# clear SmartScreen on its own. Instead this attaches build provenance - a cryptographic
# attestation binding each artifact to the exact commit and workflow run, verifiable with
# `gh attestation verify` - proving where the binary came from.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual build (defaults to the workspace version)"
        required: false

permissions:
  contents: write # create the release + upload assets
  id-token: write # provenance attestation signing
  attestations: write # record the attestation

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: refusals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # A release label must agree with the binary version, whether tagged or manual.
      - name: Resolve and verify version
        id: v
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_id="$(cargo pkgid -p neuron-cli --locked)"
          if [[ ! "$package_id" =~ \#([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::could not read the workspace version from cargo"
            exit 1
          fi
          cargo_ver="v${BASH_REMATCH[1]}"
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${REQUESTED_VERSION:-$cargo_ver}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] ||
             [ "${version%%-*}" != "$cargo_ver" ]; then
            echo "::error::release label $version does not match workspace version $cargo_ver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Provenance attestations only work on public repos. SOURCE.txt tells users to verify
      # one, so a tagged release from a private repo would ship a promise it can't keep. Tag
      # pushes fail fast here; a manual test run (workflow_dispatch) skips attestation instead,
      # with a warning. Refusing in preflight means neither build job burns minutes first.
      - name: Releases need a public repo
        if: github.event_name == 'push' && github.event.repository.private
        shell: bash
        run: |
          echo "::error::this repo is private, so the build provenance attestation cannot be created. Make the repo public, then push the tag again."
          exit 1

  windows:
    name: windows x86_64
    needs: preflight
    runs-on: windows-latest
    # `-Mode full` runs the test compile, a clippy compile, four feature checks, and a ThinLTO
    # release build, all on 2 cores - 60 min would time out before that finishes.
    timeout-minutes: 180
    env:
      # Static CRT, or the zip doesn't launch on a clean machine: a Rust MSVC binary otherwise
      # imports VCRUNTIME140.dll (ships with the VC++ Redistributable, not with Windows itself),
      # so a fresh install without it gets a missing-DLL dialog. +crt-static links the runtime in
      # instead; the api-ms-win-crt-* imports are the Universal CRT and are part of Windows 10+.
      # Job-scoped: the same flag against glibc breaks NSS (DNS and user lookups).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy # -Mode full runs clippy; without this it reports a phantom failure

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true # same reason as ci.yml: a failed run must still warm the cache

      # Same cache as ci.yml - build.rs fetches a 22 MB CPython tarball on a miss, then slims it.
      - name: Cache the bundled CPython tarball
        uses: actions/cache@v6
        with:
          path: vendor/pbs-cache
          key: pbs-${{ runner.os }}-${{ hashFiles('crates/neuron-core/build.rs') }}
          restore-keys: pbs-${{ runner.os }}-

      # The gates run against a release too - a tag must not ship something main wouldn't
      # accept. Runs the full pass (feature matrix + no-hardware ignored tests), the same
      # script a contributor runs locally.
      - name: validate (full)
        shell: pwsh
        run: ./validate.ps1 -Mode full

      # The same package script used for local smoke builds creates both assets.
      - name: Package installer and portable ZIP
        shell: pwsh
        env:
          CARGO_TARGET_DIR: target
        run: ./packaging/package-windows.ps1 -Version '${{ needs.preflight.outputs.version }}'

      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    name: draft release
    needs: [preflight, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # for .github/releases/<tag>.md

      # Flatten the package artifact so SHA256SUMS.txt lists the downloaded filename.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum neuron-*-windows-x86_64-setup.exe neuron-*-windows-x86_64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed provenance tying each artifact to this commit + this workflow. Verify with
      # `gh attestation verify <file> --repo <owner/repo>`.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*-setup.exe
            dist/*.zip

      - name: Warn when there is no attestation
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          msg="TEST BUILD ONLY: the repo is private, so these artifacts have NO provenance attestation, and their SOURCE.txt tells users to verify one. Delete this draft; do not publish it."
          echo "::warning::$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # Hand-written notes in .github/releases/<tag>.md win; otherwise GitHub generates them.
          notes=".github/releases/${VERSION}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          assets=(dist/*-setup.exe dist/*.zip dist/SHA256SUMS.txt)
          gh release create "$VERSION" "${assets[@]}" \
            --draft \
            --title "neuron $VERSION" \
            "${notes_args[@]}" \
            || gh release upload "$VERSION" "${assets[@]}" --clobber
