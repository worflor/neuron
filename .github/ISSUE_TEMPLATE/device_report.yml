name: Device compatibility report
description: Tried neuron on your hardware? Tell me what worked, even if nothing did.
title: "[device] "
labels: [enhancement, needs-triage, "area:device"]
body:
  - type: markdown
    attributes:
      value: |
        thanks for trying neuron. the quickest way here is from the app: on the DEVICE page, press **check** on the device's row, then **report**. this form opens with the device, your system and the check filled in, so you only add what worked.

        no row for it, or an older neuron? fill it in by hand. a short report is fine.
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "e.g. Razer Naga V2 Pro"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How is it connected?
      options:
        - Wired / USB
        - USB receiver / dongle
        - Bluetooth
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OS and neuron version (if you know them)
      placeholder: "e.g. Windows 11, neuron v0.1.8"
  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - Everything I tried worked
        - Some things worked
        - Detected, but nothing I tried worked
        - Not detected
        - Just investigating / not sure yet
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try, and what happened?
      description: even one setting is useful. say what worked and what didn't; no need to test everything.
      placeholder: "DPI worked. the mouse was detected, but side buttons didn't remap..."
    validations:
      required: true
  - type: dropdown
    id: dynamic-lighting
    attributes:
      label: Is Windows Dynamic Lighting on?
      description: Windows 11 › Settings › Personalization › Dynamic Lighting. on newer boards Windows can hold the lights, so this matters for lighting problems.
      options:
        - Not sure
        - "On"
        - "Off"
        - Not Windows 11
  - type: textarea
    id: evidence
    attributes:
      label: Device check (optional)
      description: the app's **report** fills this in. by hand, press **copy** in the row's check and paste it here. don't paste serial numbers, device paths or private data.
  - type: textarea
    id: device-file
    attributes:
      label: What neuron learned (optional)
      description: |
        the app's **report** fills this in for a device neuron learned. by hand, paste the device's file from `%LOCALAPPDATA%\neuron\devices\auto`, named after its family and product id (like `razer-0293.toml`), and delete its `# Probed unit serial` line first.
  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: steps to reproduce, a [Compatibility Lab](https://github.com/worflor/neuron/blob/main/docs/reference/COMPATIBILITY-LAB.md#try-it-yourself) bundle you've reviewed, or what you wish the device could do.
