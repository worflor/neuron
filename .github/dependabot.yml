# Keeps the workflows' `uses: …@vN` pins from rotting, and nothing else.
#
# Only github-actions: cargo dependencies are deliberately not here. Cargo.lock is committed
# and CI builds with --locked, so a dependency bump is a real change a human should decide on.
#
# Monthly and grouped into one pull request, because every workflow edit triggers a full
# windows CI run.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump workflow actions"
