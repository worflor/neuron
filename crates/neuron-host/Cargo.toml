# neuron-host — the protocol-host kernel: ownership arbiter, signal bus,
# declaration journal, and the damped restart governor.
#
# Deliberately PURE STD: no dependencies, no I/O, no platform code. Everything
# in this crate is a deterministic state machine that can be exhaustively
# unit-tested with an injected clock. Wire protocols, sockets, and device
# writes live in adapters OUTSIDE this crate and talk to it through plain
# function calls (later: one actor thread + channels).
[package]
name = "neuron-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol-host kernel: ownership arbiter, signal bus, declaration journal, damped restart governor"

