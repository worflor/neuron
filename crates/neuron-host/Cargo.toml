# neuron-host — the protocol-host kernel: ownership arbiter, signal bus,
# declaration journal, damped restart governor, host shell, and protocol
# adapters (pure state machines; sockets live in the process shell).
#
# Kernel modules (arbiter/bus/journal/governor/shell/writer) are pure std: deterministic
# state machines, unit-tested with injected clocks. Adapters may use already-declared
# workspace deps (serde/serde_json for the Chroma REST JSON bodies); no new ones introduced.
# Deps are added deliberately and sparingly: new code should not mean new deps.
[package]
name = "neuron-host"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Protocol-host kernel: ownership arbiter, signal bus, declaration journal, damped restart governor, protocol adapters"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The neuron-core bridge (feature-gated so the kernel itself stays pure-std;
# an INTERNAL workspace path dep, not a new external dependency).
neuron = { path = "../neuron-core", optional = true }
anyhow = { workspace = true, optional = true }

# Win32 FFI for the Chroma SHM server pump (create the named objects, read the device
# buffers). Only compiled on Windows and only when `bridge` is on; the pure protocol codec
# needs none of it.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
]

[features]
# Real-hardware bridge: registry discovery -> surfaces, HID frame sinks behind the single
# writer. Off by default; the kernel + adapters build and test with zero deps beyond serde.
bridge = ["dep:neuron", "dep:anyhow", "dep:windows-sys"]

[[example]]
name = "host_serve"
required-features = ["bridge"]

[[example]]
name = "chroma_serve"
required-features = ["bridge"]

[[example]]
name = "chroma_paint"
required-features = ["bridge"]

[dev-dependencies]
proptest = "1"
static_assertions = "1.1"
serde_json = "1"
neuron-testkit = { path = "../neuron-testkit" }
# `mock-transport` compiles neuron-core's transport policy into this crate's test binary;
# the ctor hook in lib.rs denies hardware before any test runs.
neuron = { path = "../neuron-core", features = ["mock-transport"] }
ctor = "0.2"
