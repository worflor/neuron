# neuron-app — the resident GUI + tray app (Slint UI rendering stops while hidden; live
# input, device, audio and host workers continue). The one long-lived
# process: tray icon, global hotkey loops, device-runtime daemon, eagerly-created hidden Slint window.
# Depends on neuron-core for all logic (in-process, no IPC).
#
# Dependencies are added here deliberately and sparingly: new code should not mean new deps.
#   slint + slint-build  — declarative UI, GPU (femtovg) renderer.
#   tray-icon            — the 90%-surface system-tray menu.
#   global-hotkey        — OS-wide hotkeys (profile quick-switch, HyperShift toggle).
#   image                — decode the embedded tray icon PNG at startup.
[package]
name = "neuron-app"
description = "Neuron resident app — tray + Slint GUI for the anti-Synapse."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "neuron-app"
path = "src/main.rs"

[dependencies]
# idle-power-write: the sleep-timer SET (0x07/0x03) is hardware-confirmed on the Naga V2
# Pro, so the app ships with it enabled; still verify-gated (every write re-reads 0x07/0x83
# and demands the echo).
neuron = { path = "../neuron-core", features = ["idle-power-write"] }
# The protocol host: ownership arbiter + OpenRGB/Chroma servers + the neuron-core bridge
# (the "bridge" feature pulls in the real HID sinks). Lets games (Chroma) and RGB tools
# (OpenRGB) drive the same lighting the app edits, with the app's layer stack as the
# animated base layer underneath.
neuron-host = { path = "../neuron-host", features = ["bridge"] }
# strokelab (dev stroke dump) serializes the full eigenmotion bundle as JSON and runs the raw
# stroke through the engram trajectory codec for the macro+micro oscillator decomposition.
engram = { path = "../engram" }
serde.workspace = true
serde_json = "1"
toml.workspace = true
anyhow.workspace = true
# Both renderers compiled: FemtoVG/OpenGL for the UI and software for hosts with weak
# graphics support. NEURON_RENDERER=software selects the latter explicitly. Slint's
# selector can fall back during backend construction, but graphics initialization can
# fail later when the window opens, so selection is not a driver compatibility test.
slint = { version = "1.16", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg", "renderer-software"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
cpal.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# The resident menu is shared. Linux uses GTK/AppIndicator for the tray and X11 for
# global hotkeys; a Wayland session can still use the menu when hotkeys are unavailable.
tray-icon = "0.24"
global-hotkey = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
# Lock the main thread's COM apartment to STA before winit/tray-icon/Core-Audio touch COM:
# winit's OleInitialize needs STA, while tray-icon + neuron-core's audio request MTA.
# Initializing STA first wins; their later MTA requests fail harmlessly (RPC_E_CHANGED_MODE).
windows-sys = { version = "0.59", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",                  # ShellExecuteW — summon launches an app (Win+R resolution)
    # control center: net medium + SSID + bluetooth presence, no elevation
    "Win32_NetworkManagement_IpHelper",# GetAdaptersAddresses — ethernet vs wifi, online route
    "Win32_NetworkManagement_Ndis",    # IF_OPER_STATUS / NET_LUID (IP_ADAPTER_ADDRESSES struct deps)
    "Win32_Networking_WinSock",        # SOCKET_ADDRESS (IP_ADAPTER_ADDRESSES struct deps)
    "Win32_NetworkManagement_WiFi",    # WlanOpenHandle/QueryInterface — the connected SSID
    "Win32_Devices_Bluetooth",         # BluetoothFindFirstRadio — is a BT radio present
    "Win32_Devices_HumanInterfaceDevice", # GUID_DEVINTERFACE_HID — scope the hotplug notification to HID
    # crash recovery:
    "Win32_System_Threading",          # GetCurrentThreadId for flight-event attribution
    "Win32_System_Recovery",           # RegisterApplicationRestart — OS respawns us after a crash
    "Win32_System_Diagnostics_Debug",  # SetUnhandledExceptionFilter — native faults leave a trace
    "Win32_System_Kernel",             # EXCEPTION_POINTERS/CONTEXT for the SEH filter
    # synapse purge: stop respawning services, then terminate every process
    "Win32_System_Diagnostics_ToolHelp", # CreateToolhelp32Snapshot — enumerate live processes by name
    "Win32_System_Services",           # SCM: stop RzActionSvc/Razer Synapse Service/… so they can't respawn
    "Win32_Security",                  # OpenProcessToken/TokenElevation — are we elevated
] }

[build-dependencies]
slint-build = "1.16"

[features]
default = []
# Opt-in experimental WGPU UI renderer; layered overlays and materials remain CPU paths.
wgpu-renderer = ["slint/renderer-femtovg-wgpu", "slint/unstable-wgpu-28"]

[dev-dependencies]
proptest = "1"
# `mock-transport` compiles neuron-core's transport policy into this crate's test binary; the
# ctor hook in testsupport denies hardware before any test runs, same as neuron-core's own tests.
neuron = { path = "../neuron-core", features = ["mock-transport"] }
ctor = "0.2"

[lints]
workspace = true
