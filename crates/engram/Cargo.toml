# The Woflo Labs Engram Universal Trajectory Codec, included in Neuron.
# SPDX-FileCopyrightText: 2026 Woflo Labs
# SPDX-License-Identifier: LicenseRef-WLCSL-1.0
# This crate is governed by the Work Notice and WLCSL-1.0 text in its LICENSE.md.
# Neuron's GPL-covered code combines with it under the repository-root exception.
#
# KNOCKBACK uses this crate as the rhythm-familiar's brain: every exchange is an Engram
# block; the twin's knockback is `predict_all` run one beat past the player's motif.
[package]
name = "engram"
version = "0.1.0"
edition = "2024"
description = "The Whisper Engram Universal Trajectory Codec"
license-file = "LICENSE.md"
authors = ["Woflo Labs"]
repository = "https://github.com/worflor/neuron"
publish = false

[lib]
name = "engram"
crate-type = ["lib"]

[dependencies]
num-complex = "0.4"
rayon = "1.10"              # parallel pair processing

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
