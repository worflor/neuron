# neuron-cli — the thin command-line client. All logic lives in neuron-core; this is a
# throwaway front-end that wires subcommands to engine calls.
#
# Dependencies are added here deliberately and sparingly: new code should not mean new deps.
[package]
name = "neuron-cli"
description = "Neuron command-line client — the anti-Synapse CLI."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "neuron"
path = "src/main.rs"

[dependencies]
# idle-power-write: the sleep-timer SET (0x07/0x03) is hardware-confirmed (Naga V2 Pro,
# 2026-07-02 round-trip), so the CLI ships with the write enabled; it stays verify-gated
# (every write re-reads 0x07/0x83 and demands the echo).
neuron = { path = "../neuron-core", features = ["idle-power-write"] }
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
]

[dev-dependencies]
# Test builds sever the wire: `mock-transport` compiles neuron-core's transport policy into this
# crate's test binary, and the ctor hook in the test module denies hardware before any test runs.
neuron = { path = "../neuron-core", features = ["mock-transport"] }
ctor = "0.2"
