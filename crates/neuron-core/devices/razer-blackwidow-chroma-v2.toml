# Device definition — Razer BlackWidow Chroma V2 (older era: legacy lighting, NO onboard
# storage). Confirmed live: razer_report on usage 0001/0002, classes 0x00/0x02/0x03 only,
# serial IO1735F09002641, device mode 0x03. This file exists mainly to drive the keyboard's
# legacy (class 0x03) lighting through the SAME unified model as the matrix-era mouse.

name = "Razer BlackWidow Chroma V2"
codename = "BlackWidow Chroma V2"
vendor_id = 0x1532
# SPLIT-BRAIN device: this board needs DIFFERENT transaction_ids per command family
# (verified against OpenRazer razerkbd_driver.c CHROMA_V2 + live `neuron probe`).
#   - device DEFAULT = 0xFF: getters (firmware/serial 0x00/0x81-82), device-mode
#     (0x00/0x04 + 0x00/0x84), brightness (0x03/0x01), Game/Macro LED + LED-effect state.
#     (These "pass by luck" at any tx since simple getters ignore the tx field.)
#   - lighting EFFECT (0x03/0x0A) + CUSTOM-FRAME (0x03/0x0B) = 0x3F (per-command override below).
# Was a single global 0x1F, which silently NO-OP'd lighting writes (they DON'T ignore tx).
transaction_id = 0xFF

[[modes]]
name = "wired"
product_id = 0x0221

[control_interface]
usage_page = 0x0001
usage = 0x0002
feature_report_len = 91

[commands.firmware_version]
class = 0x00
id = 0x81
size = 0x02

[commands.serial]
class = 0x00
id = 0x82
size = 0x16

[commands.device_mode]
class = 0x00
id = 0x84
size = 0x02

# FIRMWARE GAME MODE — the keyboard's own FN+F10-toggled Win-key kill (GAME_LED state, OpenRazer
# razer_chroma_standard_get/set_led_state with GAME_LED=0x08; device-default 0xFF tx).
# CONFIRMED live on this board (game_mode_probe, 2026-07-07): getter echoed [00 08 01] with the
# LED lit, setter 0x03/0x00 [00 08 00] ACKed and read back [00 08 00] — the LED visibly went
# dark on the software write. Device-PHYSICAL kill (firmware eats the Win key with zero
# software) — the hardware sibling of the host-side KEY GUARD swallows; surfaced because it
# silently ate the user's Win key on 2026-07-07 while every host layer probed clean. NOTE: the
# FN+F10 toggle itself only works in NORMAL device mode (0x00) — in driver mode the keyboard
# defers FN combos to software (OpenRazer #1174 is the same bug class), which is why the
# restore-on-idle device-mode contract matters.
# getter: args = [varstore, GAME_LED]; response arg[2] = state (0/1).
[commands.game_mode]
class = 0x03
id = 0x80
size = 0x03
args = [0x00, 0x08]

# setter: args = [varstore, GAME_LED, state] supplied at runtime.
[commands.set_game_mode]
class = 0x03
id = 0x00
size = 0x03

# Legacy lighting getters — CONFIRMED live (03/88 current state, 03/89 capabilities).
[commands.lighting_state]
class = 0x03
id = 0x88
size = 0x06

[commands.lighting_caps]
class = 0x03
id = 0x89
size = 0x07

# --- Unified lighting: LEGACY dialect (class 0x03, the older era) ----------------------
# Setter opcodes/effect-ids below are the standard legacy Chroma values and are PROVISIONAL
# pending a gated round-trip verify; the getters above are confirmed. The dry-run preview
# shows the exact bytes before anything is ever sent.
# PROVISIONAL — still pending the parent's LIVE hardware verify (lighting the keyboard red to
# confirm the 0x3F tx actually renders). The split-brain tx fix (0xFF default + 0x3F lighting)
# is derived from OpenRazer + the live probe, NOT yet confirmed on this physical board.
[lighting]
protocol = "legacy"
rows = 6
cols = 22                      # BlackWidow key matrix
varstore = 0x00               # no onboard storage on this board -> volatile only
led_id = 0x00

[lighting.effects]            # native legacy effects: name -> effect-id byte (provisional)
off = 0x00
wave = 0x01
reactive = 0x02
breathing = 0x03
spectrum = 0x04
static = 0x06

[lighting.effect]             # legacy "set led effect": args = effect-id [+ color]
class = 0x03
id = 0x0A
size = 0x08
args = []
transaction_id = 0x3F        # CHROMA_V2 lighting tx (OpenRazer); default 0xFF no-ops the write

[lighting.custom_frame]       # legacy custom row paint: [0xFF frame-id, row, start, stop, RGB...]
class = 0x03
id = 0x0B
size = 0x46
args = [0xFF]                 # frame-id prefix (confirmed via OpenRazer + live)
transaction_id = 0x3F        # CHROMA_V2 lighting tx (OpenRazer); default 0xFF no-ops the write

# Standard LED brightness (OpenRazer razer_chroma_standard_set_led_brightness): class 0x03 /
# id 0x03, args [VARSTORE=0x01, BACKLIGHT_LED=0x05, level]. The V2 uses the device-default tx
# (0xFF) for brightness — NOT the 0x3F lighting tx. (Was id 0x01: wrong opcode, silently no-op'd.)
[lighting.brightness]
class = 0x03
id = 0x03
size = 0x03
args = [0x01, 0x05]
