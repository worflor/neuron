# neuron-core — the headless engine. All device protocol, capabilities, lighting/effects,
# gestures/radial/cast, profiles, the unified Trigger->Action spine, the macro engine, device
# writes, and Synapse migration. UI-agnostic: the CLI and the GUI both `use neuron::*`.
#
# Dependencies are added here deliberately and sparingly: new code should not mean new deps.
# Every anticipated dependency is already declared.
[package]
name = "neuron"
description = "Open, lightweight control for Razer devices. The anti-Synapse."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
# Bundles a private CPython into the binary: build.rs downloads (sha256-verified against the
# release's SHA256SUMS manifest) a python-build-standalone tarball for the build target, caches
# it under vendor/pbs-cache/, and hands its path via NEURON_PY_TARBALL, which
# macros/pyruntime.rs `include_bytes!`s. No system Python dependency at runtime.
build = "build.rs"

[lib]
name = "neuron"
path = "src/lib.rs"

[features]
# Compile-time gate for the HyperScroll (class 0x0B) stage write in writes.rs. Byte layout is
# a structural reconstruction, not yet confirmed on hardware, so off by default. Enable with
# `--features hyperscroll-write` once verified on the Naga (or `NEURON_HYPERSCROLL_WRITE` at
# runtime, to probe without a rebuild).
hyperscroll-write = []
# Enables the failpoint registry (src/failpoint.rs) in non-test builds, e.g. a chaos/soak
# binary that wants fault injection against release-shaped code. `cargo test` gets the registry
# via cfg(test) without this; release builds without it compile every failpoint to nothing.
failpoints = []
# Compile-time gate for the LED idle/power-timeout write (0x07/0x03, writes.rs::set_idle_secs).
# Both directions are hardware-confirmed on the Naga V2 Pro, so the app + CLI enable this
# feature. Stays a feature (not unconditional) so a bare library build defaults to no device
# writes; `NEURON_IDLE_WRITE` is the runtime escape hatch.
idle-power-write = []
# Compile-time gate for the in-game (wired/dongle) polling-rate write (0x00/0x06,
# writes.rs::set_in_game_polling). Derived from the proven single-rate setter; off until the
# dual-rate round-trip is hardware-verified (or `NEURON_INGAME_POLL_WRITE` at runtime).
ingame-poll-write = []
# Compile-time gate for the Snap Tap (SOCD) write (0x02/0x27, writes.rs::set_snap_tap). A
# Synapse-4-era keyboard feature; layout from OpenRazer #2754, has a getter (0xA7) for verify,
# off by default (this BlackWidow Chroma V2 can't do it). Enable once confirmed on a supporting
# board (or `NEURON_SNAP_TAP_WRITE` at runtime).
snap-tap-write = []
# Exposes the phantom-device harness (src/transport/mock.rs) and the `Backend` install hook to
# other crates' tests; neuron-core's own unit tests get both via cfg(test) without this. Without
# it, `installed_backend()` is a compile-time `None`, so the branch folds away in release.
mock-transport = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true

# The Woflo Labs Engram trajectory codec, included under its own terms — the rhythm
# familiar's brain in KNOCKBACK: every exchange is an Engram block; the twin's knockback is
# `predict_all` run one beat past the player's motif.
engram = { path = "../engram" }

# Synapse migration (import.rs): the official Export format is a ZIP with a fake extension
# (.synapse3 / .ChromaEffects) — unzip it.
zip.workspace = true
# Synapse migration (import.rs): parse the plaintext XML inside the export (DeviceInfo.xml,
# Features/*.xml mappings + lighting).
quick-xml.workspace = true

# Bundled-CPython materialization (macros/pyruntime.rs). Interpreter tarball is embedded at
# compile time (include_bytes!) and unpacked into the user's data dir on first use. tar +
# flate2 are pure-Rust so extraction is identical across platforms (no shelling out to system
# tar/gzip). `dirs` resolves the per-user data-local dir cross-platform.
tar = "0.4"
flate2 = "1"
dirs = "6"

# Build-time only: fetch + verify the python-build-standalone tarball for the build target.
# `ureq` is a small blocking HTTP client (rustls, no OpenSSL); `sha2` checks the download
# against the release's SHA256SUMS manifest. Neither ships in the final binary.
#
# `tar` + `flate2` are reused from [dependencies] to stream-slim the upstream
# install_only_stripped tarball at build time (drop pip/ensurepip/venv, test suite, idlelib/
# lib2to3/turtledemo, C headers, __pycache__ dupes) before embedding it. Adds no new crate to
# the graph.
[build-dependencies]
ureq = "3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

# The Linux HID transport (transport/hidraw.rs): raw ioctl/poll/read/flock syscalls against
# /dev/hidrawN. No higher-level hidapi/nix wrapper — the surface needed (a handful of ioctls,
# poll, flock) is small enough that a direct libc binding stays simpler than a dependency that
# would pull in its own abstraction over the same syscalls.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Shutdown",  # LockWorkStation — the `system · lock` action
    "Win32_System_Power",     # SetSuspendState — the `system · sleep` action
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
]

[dev-dependencies]
proptest = "1"
static_assertions = "1.1"
ureq = "3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

[[test]]
name = "build_script"
path = "build.rs"
