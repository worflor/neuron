# PROTOCOL LEDGER — the evidence behind every wire fact neuron speaks.
#
# One [[fact]] per opcode, push report, framing rule, transaction-id assignment, mode or value
# table. `tests/protocol_ledger.rs` enforces it: every opcode in a builtin device def or sent by
# neuron-core needs a fact; a grade must be backed by the evidence it claims; a write graded below
# `capture` needs a `gate` (a NEURON_*_WRITE env var or cargo feature) or a declared `ungated_debt`.
#
# Grades, strongest first:
#   live     observed by neuron on real hardware (evidence kind "live", dated)
#   capture  seen on the wire in a capture of Razer's own software (evidence kind "capture")
#   agreed   two or more INDEPENDENT sources say so (a source's `derived_from` chain collapses copies)
#   single   one source says so
#   derived  structural reconstruction or guess
#
# Upstream sources are cited as facts only: `at` is `path#Lnn` in the pinned `sha`, or a URL.
# No upstream code is copied here.
#
# Fact fields:
#   key       "<dialect>/<class>/<id>" (hex, lowercase) for get/set, optionally "#variant";
#             "<dialect>/<topic>/<name>" otherwise (e.g. "razer/push/05-3a", "razer/frame/crc")
#   dialect   "razer" | "razer-audio" | "hidpp"
#   kind      get | set | push | frame | tx | mode | enum
#   class, id opcode bytes (get/set only)
#   layout    byte layout, e.g. "[varstore] -> [varstore, stage]"
#   meaning   what it does
#   devices   pids neuron uses it on, e.g. ["00a8", "0221"]
#   grade     see above
#   gate / ungated_debt   (set facts below `capture` only)
#   evidence  [{ kind = "live"|"capture"|"source", src, at, date, what }]
#   conflicts where a source disagrees and how (or whether) it was settled
#   unused    true = known upstream but neuron does not send it (a candidate, exempt from gating)
#
# Dating live evidence: `date` is the day of the observation where neuron recorded one. Where the
# owner's notes give only a month ("2026-06"), `date` is the commit that first recorded the claim
# (an upper bound) or, failing that, the last day of the month; the `what` text says which.
# Openrazer path shorthands used below are full repo paths (driver/razercommon.c etc.).

