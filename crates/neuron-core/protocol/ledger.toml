[[fact]]
key = "razer/frame/reply-validation"
dialect = "razer"
kind = "frame"
layout = "accept only if len >= 91, buf[0]==0, buf[2]==request tx, buf[6]<=80, buf[90]==0, crc ok, class and id echo"
meaning = "neuron's ACK'd exec rejects any reply that does not echo tx, class and id with a valid CRC."
devices = ["00a7", "00a8", "0221"]
grade = "live"
evidence = [
  { kind = "live", date = "2026-09-24", what = "validator shipped; BW getter and awake Naga getters passed; asleep Naga timed out as silence" },
  { kind = "source", src = "opensnek", at = "OpenSnek/Sources/OpenSnekHardware/USBHIDControlSession.swift#L183-L215", what = "validates tx, class and id" },
  { kind = "source", src = "razermouse", at = "crates/razer-core/src/engine.rs#L7-L32", what = "validates CRC and echo" },
]
conflicts = [
  "openrazer never compares tx or CRC on replies and treats BUSY as success (driver/razermouse_driver.c#L116-L163); a device that rewrote tx in replies would time out under neuron.",
  "Inside neuron: synth timed_exec and the razer-audio dialect only echo-filter class/id (no tx/CRC check), unlike the ACK'd exec. Unsettled design inconsistency.",
]

[[fact]]
key = "razer/frame/exec-poll"
dialect = "razer"
kind = "frame"
layout = "SET, then up to 60 polls x 10 ms; re-send SET when i%12==11; Busy/Timeout/New keep polling; Fail/Unsupported terminal"
meaning = "ACK'd command discipline (about 600 ms budget)."
devices = ["00a7", "00a8", "0221"]
grade = "live"
evidence = [
  { kind = "live", date = "2026-09-29", what = "15/00 writes acknowledged through this loop over the Naga dongle and confirmed by 15/80" },
  { kind = "source", src = "razerlite", at = "src/Protocol.cs#L82-L136", what = "on the HyperPolling dongle a BUSY reply only clears by re-sending, not re-reading" },
]
conflicts = [
  "openrazer retries 5x at 10 ms and accepts BUSY as success (driver/razermouse_driver.c#L116-L163); neuron treats BUSY as pending. Not contradicted on owned hardware.",
]

