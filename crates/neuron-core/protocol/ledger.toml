[[fact]]
key = "razer/frame/report"
dialect = "razer"
kind = "frame"
layout = "HID feature report, 91-byte buffer = report id 0x00 + 90-byte razer_report"
meaning = "The control-pipe unit: every razer command and reply is one 91-byte feature report (REPORT_LEN 90, BUF_LEN 91)."
devices = ["00a7", "00a8", "0221"]
grade = "live"
evidence = [
  { kind = "live", date = "2026-09-24", what = "BW 0221 00/81 and awake Naga 00a8 00/81, battery and DPI replies passed the full-frame validator (docs/STATUS.md receive-path entry)" },
  { kind = "source", src = "openrazer", at = "driver/razercommon.h#L124-L136", what = "90-byte razer_report struct" },
  { kind = "source", src = "openrgb", at = "Controllers/RazerController/RazerController/RazerController.h#L192-L205", what = "91 bytes including the leading report id" },
  { kind = "source", src = "naga-companion", at = "docs/architecture.md#L101-L103", what = "control collection is the one with max feature report length 91" },
]

[[fact]]
key = "razer/frame/header"
dialect = "razer"
kind = "frame"
layout = "buf[0]=0x00 id; [1] status; [2] tx; [3..=4] remaining_packets; [5] protocol_type 0; [6] data_size; [7] class; [8] id; [9..=88] 80 args; [89] crc; [90] reserved 0"
meaning = "Header byte positions (report[n] = buf[n+1])."
devices = ["00a7", "00a8", "0221"]
grade = "live"
evidence = [
  { kind = "live", date = "2026-09-24", what = "replies from both owned devices parse and validate at these offsets" },
  { kind = "source", src = "openrazer", at = "driver/razercommon.h#L124-L136", what = "same field order" },
  { kind = "source", src = "uchroma", at = "rust/hid/report.rs#L3-L13", what = "same field order" },
]
conflicts = [
  "uchroma writes remaining_packets little-endian (rust/hid/report.rs#L157) while openrazer/librazermacos say big-endian; moot for neuron, which always sends 0.",
]

[[fact]]
key = "razer/frame/crc"
dialect = "razer"
kind = "frame"
layout = "crc = XOR of report bytes [2..=87] (buf[3..=88]), stored at report[88] (buf[89])"
meaning = "Checksum. Excludes status and tx."
devices = ["00a7", "00a8", "0221"]
grade = "live"
evidence = [
  { kind = "live", date = "2026-09-24", what = "replies from BW 0221 and Naga 00a8 pass neuron's CRC check at this range" },
  { kind = "source", src = "openrazer", at = "driver/razercommon.c#L111-L124", what = "XOR i=2..87" },
  { kind = "source", src = "openrgb", at = "Controllers/RazerController/RazerController/RazerController.cpp#L581-L602", what = "same range shifted by the report id" },
  { kind = "source", src = "librazermacos", at = "src/lib/razercommon.c#L124-L138", what = "same range" },
  { kind = "source", src = "naga-companion", at = "src/NagaBatteryTray/Hid/RazerProtocol.cs#L301-L311", what = "CRC over buffer[3..88] compared to buffer[89], on Naga V2 Pro" },
]
conflicts = [
  "uchroma XORs bytes 1..=86 (includes tx, excludes arg byte 79; rust/crc.rs#L25) and its own tests/docs disagree. Settled for replies by neuron's live validator; whether firmware checks the host CRC at all is unknown.",
]

