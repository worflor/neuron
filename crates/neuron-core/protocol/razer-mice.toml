# RAZER MOUSE ATLAS: what two open implementations send each Razer mouse.
#
# Generated by `cargo run -p neuron-testkit --bin razer-atlas -- --mice` from pinned checkouts;
# do not edit by hand. Facts only, one [[mouse]] per USB PID, each source's values kept apart.
# OpenRGB derives from openrazer, so agreement here is one lineage; nothing is hardware evidence.
#
# openrazer: interface and wait_us (the SET->GET wait) from the mouse driver's razer_get_report
#   (driver/razermouse_driver.c L33, the default branch's when the PID takes it);
#   rows/cols from the daemon class at `at`.
# openrgb (Controllers/RazerController): class, tx, led, rows, cols from the razer_device entry at
#   `at`; interface, usage_page, usage from the REGISTER_HID_DETECTOR_IPU line at `detect_at`.

[sources.openrazer]
url = "https://github.com/openrazer/openrazer"
license = "GPL-2.0-or-later"
sha = "unknown"

[sources.openrgb]
url = "https://gitlab.com/CalcProgrammer1/OpenRGB"
license = "GPL-2.0-or-later"
sha = "e4af57cdfcd25c4a1e1c97185fe9c6cbf2ac79c3"
derived_from = "openrazer"

