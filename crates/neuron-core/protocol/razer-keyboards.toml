# RAZER KEYBOARD ATLAS: what three open implementations send each Razer keyboard.
#
# Generated by `cargo run -p neuron-testkit --bin razer-atlas` from pinned checkouts; do not
# edit by hand. Facts only, one [[keyboard]] per USB PID, each source's values kept apart.
# `src/atlas.rs` weighs agreement by independent lineage (OpenRGB derives from openrazer;
# SignalRGB is its own); nothing here is hardware evidence. Synthesis uses these values as
# priors, and probing still decides what a board answers.
#
# openrazer (driver/razerkbd_driver.c): class and effect_tx from the static-effect builder
#   (razer_attr_write_matrix_effect_static, L3022); getter_tx from the brightness read
#   (razer_attr_read_matrix_brightness, L4346); frame_tx from the custom-frame rows
#   (razer_attr_write_matrix_custom_frame, L4588); interface from razer_get_report_params
#   (L346), the default branch's when the PID takes it, with wait_us, its SET->GET wait;
#   rows/cols from the daemon class at `at`.
# openrgb (Controllers/RazerController): class, tx, led, rows, cols from the razer_device entry at
#   `at`; interface, usage_page, usage from the REGISTER_HID_DETECTOR_IPU line at `detect_at`.
# signalrgb (Plugins/Razer): interface from Validate(); class, row_tx and cols from the function
#   building the custom-frame row report (cols = (data_size - 5) / 3) at `at`.

[sources.openrazer]
url = "https://github.com/openrazer/openrazer"
license = "GPL-2.0-or-later"
sha = "cd5c4243bfafb08df7e2d2963367c3c150626eac"

[sources.openrgb]
url = "https://gitlab.com/CalcProgrammer1/OpenRGB"
license = "GPL-2.0-or-later"
sha = "e4af57cdfcd25c4a1e1c97185fe9c6cbf2ac79c3"
derived_from = "openrazer"

[sources.signalrgb]
url = "https://gitlab.com/signalrgb/signal-plugins"
license = "NOASSERTION"
sha = "95031635526054e267124fb32cf04509375f34ea"

