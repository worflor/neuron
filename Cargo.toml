# Neuron — open, lightweight control for Razer devices. The anti-Synapse.
#
# Cargo WORKSPACE. The engine lives in `neuron-core` (a headless, UI-agnostic library);
# `neuron-cli` is the thin command-line client; `neuron-app` is the resident GUI/tray app
# (Slint). One process model — no internal IPC.
#
# Dependencies are added here deliberately and sparingly: new code should not mean new deps.
# Everything anticipated is already declared, so reach for what's here before adding anything.
[workspace]
resolver = "2"
members = [
    "crates/engram",
    "crates/neuron-core",
    "crates/neuron-host",
    "crates/neuron-cli",
    "crates/neuron-app",
    "crates/neuron-testkit",
]

# Shared metadata so every crate stays in lockstep.
[workspace.package]
version = "0.1.1"
edition = "2021"
license-file = "LICENSE.md"
authors = ["Woflo Labs"]
repository = "https://github.com/worflor/neuron"
publish = false

# Shared dependency versions — declare once, reference with `.workspace = true` in members.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
# Cross-platform real-time audio output (WASAPI/CoreAudio/ALSA) for the notification tone synth —
# the synthesis itself is hand-rolled in neuron-core::tone; cpal is just the device handoff.
cpal = "0.15"

# Lean by design: the anti-Synapse should be a small static binary.
#
# panic = "unwind" (not abort): with abort, any panic anywhere kills the resident app
# instantly - no Drop guards (device handles, cursor locks, click-guard disarm, gated-write
# restore), no catch_unwind shells, no graceful teardown. Worth the size cost. The panic hook
# still logs every panic to neuron-crash.log.
[profile.release]
# ThinLTO does cross-module inlining via a parallel summary/call-graph index (each module
# optimized concurrently), landing within ~1-3% of fat LTO's runtime while letting cgu=16
# parallelize across cores (fat LTO + cgu=1 optimizes serially in a single thread). CPU-specific
# codegen is opt-in via external RUSTFLAGS, not a repository default, so artifacts stay portable.
opt-level = 3
lto = "thin"
strip = true
codegen-units = 16

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
strip = true
codegen-units = 16

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1

# Incremental is off for the whole dev profile: rustc/MSVC mis-handle optimized + incremental
# together (LLVM internalizes anonymous constants and shares them across codegen units, and
# the incremental cache can reuse some CGUs while regenerating others, orphaning an `anon.*`
# symbol - rust-lang/rust #86049, #45929). `neuron-app` and `neuron` run opt-level 3 in dev
# (below), so this profile counts as optimized and hits the bug. `incremental` is profile-
# scoped (Cargo forbids it under `[profile.dev.package.*]`), so it goes here.
[profile.dev]
incremental = false

# The overlay composites ~0.5M pixels/frame for a weave; at opt-level 0 the per-pixel bounds
# checks and un-vectorized float math run ~6-7x slower than release, making it crawl in a
# `cargo run` build. Optimizing only `neuron-app` (overlay + weave) and `neuron` (engine math)
# keeps the debug run usable without touching release; the rest of the workspace stays default
# (fast compiles, full debuginfo).
[profile.dev.package.neuron-app]
opt-level = 3

[profile.dev.package.neuron]
opt-level = 3

# Tests never render live overlays, and optimizing their enormous app harness turns a
# quick correctness gate into a memory-heavy release-style compile on both platforms.
[profile.test.package.neuron-app]
opt-level = 0

[profile.test.package.neuron]
opt-level = 0

# ── lints ───────────────────────────────────────────────────────────────────────────────
# Centralized lint policy for crates that opt in with `lints.workspace = true`.
# rustc lints enforce correctness and documentation; clippy lints enforce idiomatic,
# performant, safe code. The pedantic group is warn-by-default with select overrides.
[workspace.lints.rust]
# Deny immediately-fatal or unsound patterns.
# OS backends require FFI. `unsafe_code = "warn"` reported every reviewed Win32/Linux
# call without distinguishing a missing safety argument; pure modules forbid it locally.
unsafe_code = "allow"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_parens = "deny"
unused_braces = "deny"
arithmetic_overflow = "deny"
unused_doc_comments = "deny"
ellipsis_inclusive_range_patterns = "deny"
unreachable_patterns = "deny"
non_ascii_idents = "deny"
keyword_idents_2024 = "allow"  # `gen` is used as an identifier; edition 2021, safe to ignore

# Warn on things that are usually bugs or missed opportunities.
dead_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Start from pedantic, then exclude style rules that conflict with protocol constants,
# math notation, local test fixtures, or intentional ownership in public APIs.
pedantic = { level = "warn", priority = -1 }
many_single_char_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
doc_lazy_continuation = "allow"
option_if_let_else = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
struct_excessive_bools = "allow"
should_implement_trait = "allow"  # tolerant from_str methods intentionally default unknown tags
unused_self = "allow"             # keeps instance-oriented adapter APIs coherent
manual_let_else = "allow"

# ── deny: patterns that are bugs or security-relevant ──────────────────────────────────
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# stdout and stderr are the CLI's user interface and the daemon's fallback log.
dbg_macro = "deny"
exit = "deny"
get_unwrap = "deny"
# indexing_slicing: ~366 violations — promote to deny once bounds checks are added
indexing_slicing = "allow"
# integer_division_remainder_used: too aggressive for a math-heavy codebase
integer_division_remainder_used = "allow"

# ── deny: correctness / suspicious patterns ───────────────────────────────────────────
eq_op = "deny"
bool_assert_comparison = "deny"
match_ref_pats = "deny"
redundant_closure_for_method_calls = "warn"
manual_map = "deny"
needless_borrowed_reference = "deny"
collapsible_if = "deny"
collapsible_else_if = "deny"
match_single_binding = "deny"
needless_return = "deny"
useless_format = "deny"
write_with_newline = "deny"
uninlined_format_args = "warn"

# ── warn: performance ─────────────────────────────────────────────────────────────────
redundant_clone = "deny"
manual_memcpy = "warn"
manual_str_repeat = "warn"
needless_collect = "warn"

# ── warn: style and clarity ──────────────────────────────────────────────────────────
module_name_repetitions = "allow"  # common in this codebase (e.g. profile::Profile)
semicolon_if_nothing_returned = "warn"
if_not_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
single_match_else = "warn"
used_underscore_binding = "warn"
unnested_or_patterns = "warn"
from_over_into = "deny"
transmute_ptr_to_ptr = "deny"
# as_conversions: ~194 violations — promote to deny once existing code uses explicit From/Into
as_conversions = "allow"
# cast_*: ~150 violations from pedantic — promote to deny once numeric code uses explicit casts
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# similar_names: ~35 violations — promote to deny once variable names are disambiguated
similar_names = "allow"
# doc lints: promote to deny once doc coverage is complete
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

# ── restrict: language features we ban in this codebase ───────────────────────────────
# These restrict valid Rust to enforce our conventions. Cherry-picked, not the full group.
enum_glob_use = "deny"
# implicit_reexports = "deny"  # too noisy with re-exports in mod.rs
string_add = "deny"
implicit_clone = "deny"
verbose_file_reads = "deny"
format_push_string = "deny"
redundant_type_annotations = "allow"
create_dir = "deny"
path_ends_with_ext = "deny"

